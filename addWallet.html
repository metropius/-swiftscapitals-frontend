<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>swiftcaptial | Add New Wallet</title>
    <meta name="description" content="Create new payment wallet - Admin panel" />

    <link rel="shortcut icon" href="/storage/app/public/photos/TydZYFQSbyrBue0oZ1BQzOAr8y3J4VixErlONeNz.png" />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        document.documentElement.style.setProperty('--primary-color', '#0ea5e9');
        document.documentElement.style.setProperty('--primary-color-dark', '#0369a1');
        document.documentElement.style.setProperty('--primary-color-light', '#38bdf8');
        document.documentElement.style.setProperty('--secondary-color', '#14b8a6');
        document.documentElement.style.setProperty('--accent-color', '#ec4899');
        document.documentElement.style.setProperty('--text-color', '#111827');
        document.documentElement.style.setProperty('--bg-color', '#f9fafb');
        document.documentElement.style.setProperty('--sidebar-bg-color', '#1e293b');
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {500:'#0ea5e9',600:'#0ea5e9',700:'#0369a1'},
                        secondary: {500:'#14b8a6',600:'#0f766e'},
                        accent: {500:'#ec4899',600:'#db2777'}
                    }
                }
            }
        }
    </script>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: "Graphik", system-ui, sans-serif; }
        .page-loading { position:fixed; inset:0; background:#fff; z-index:9999; transition:all .4s .2s; }
        .page-loading.active { opacity:1; visibility:visible; }
    </style>
</head>

<body class="bg-gray-50 min-h-screen">

    <div class="flex h-screen overflow-hidden" x-data="{ mobileMenuOpen: false }">

        <!-- Sidebar -->
        <div :class="mobileMenuOpen ? 'translate-x-0' : '-translate-x-full'" 
             class="fixed inset-y-0 left-0 z-50 w-64 bg-gray-900 text-white transform transition-transform duration-300 ease-in-out md:relative md:translate-x-0">
            <div class="p-6 border-b border-gray-800">
                <a href="/adminiRoute">
                    <img src="/storage/app/public/photos/I98wEMilPMHkNy8wxBtJ86dmMTWl2kK4kkPJNI9l.png" alt="Logo" class="h-10 w-auto mx-auto">
                </a>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
                <a href="/adminiRoute" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 transition-colors">
                    <i data-lucide="home" class="w-5 h-5 mr-3"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/all-cards" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 transition-colors">
                    <i data-lucide="credit-card" class="w-5 h-5 mr-3"></i>
                    <span>All Cards</span>
                </a>
                <a href="/allTransfer" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 transition-colors">
                    <i data-lucide="send" class="w-5 h-5 mr-3"></i>
                    <span>All Transfers</span>
                </a>
                <a href="/allFunding" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 transition-colors">
                    <i data-lucide="download" class="w-5 h-5 mr-3"></i>
                    <span>All Deposits</span>
                </a>
                <a href="/wallets" class="flex items-center px-4 py-3 rounded-lg bg-blue-600/20 text-blue-400">
                    <i data-lucide="wallet" class="w-5 h-5 mr-3"></i>
                    <span>Wallets</span>
                </a>
                <a href="/allRefund" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 transition-colors">
                    <i data-lucide="refresh-cw" class="w-5 h-5 mr-3"></i>
                    <span>All Refunds</span>
                </a>
                <a href="/allLoans" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 transition-colors">
                    <i data-lucide="landmark" class="w-5 h-5 mr-3"></i>
                    <span>All Loans</span>
                </a>
                <a href="/allTickets" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 transition-colors">
                    <i data-lucide="ticket" class="w-5 h-5 mr-3"></i>
                    <span>Support Tickets</span>
                </a>
                <div class="pt-6 mt-auto border-t border-gray-800">
                    <a href="/logout" class="flex items-center px-4 py-3 rounded-lg text-red-400 hover:bg-gray-800 hover:text-red-300 transition-colors">
                        <i data-lucide="log-out" class="w-5 h-5 mr-3"></i>
                        <span>Logout</span>
                    </a>
                </div>
            </nav>
        </div>

        <!-- Mobile menu toggle -->
        <button @click="mobileMenuOpen = !mobileMenuOpen" class="md:hidden fixed top-4 left-4 z-50 bg-gray-900 text-white p-3 rounded-full shadow-lg">
            <i data-lucide="menu" class="w-6 h-6"></i>
        </button>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-hidden">

            <header class="bg-white shadow-sm z-10">
                <div class="px-6 py-4 flex items-center justify-between">
                    <h1 class="text-xl md:text-2xl font-bold text-gray-900">Add New Wallet</h1>
                    <a href="/wallets" class="flex items-center text-blue-600 hover:text-blue-800 font-medium">
                        <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i>
                        Back to Wallets
                    </a>
                </div>
            </header>

            <!-- Main Content -->
            <main class="flex-1 overflow-y-auto p-6 bg-gray-100">

                <div class="max-w-5xl mx-auto bg-white shadow-lg rounded-xl overflow-hidden">

                    <!-- Form -->
                    <form id="addWalletForm" class="p-8" enctype="multipart/form-data">

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                            <!-- Bank Details -->
                            <div class="md:col-span-2">
                                <h3 class="text-lg font-semibold text-gray-800 mb-4">Bank Transfer Details</h3>
                            </div>

                            <div>
                                <label for="bank_name" class="block text-sm font-medium text-gray-700 mb-1">Bank Name</label>
                                <input type="text" id="bank_name" name="bank_name" value="Mining Bank" class="block w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                            </div>

                            <div>
                                <label for="account_name" class="block text-sm font-medium text-gray-700 mb-1">Account Name</label>
                                <input type="text" id="account_name" name="account_name" value="Miller lauren" class="block w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                            </div>

                            <div>
                                <label for="account_no" class="block text-sm font-medium text-gray-700 mb-1">Account Number</label>
                                <input type="text" id="account_no" name="account_no" value="99388383" class="block w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                            </div>

                            <div>
                                <label for="sortcode" class="block text-sm font-medium text-gray-700 mb-1">Sort Code</label>
                                <input type="text" id="sortcode" name="sortcode" value="388130" class="block w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                            </div>

                            <div>
                                <label for="swift_code" class="block text-sm font-medium text-gray-700 mb-1">SWIFT Code</label>
                                <input type="text" id="swift_code" name="swift_code" value="3222ASD" class="block w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                            </div>

                            <!-- Bitcoin Wallet -->
                            <div class="md:col-span-2 mt-8">
                                <h3 class="text-lg font-semibold text-gray-800 mb-4">Bitcoin Wallet</h3>
                            </div>

                            <div class="md:col-span-2">
                                <label for="btc_wallet_address" class="block text-sm font-medium text-gray-700 mb-1">BTC Wallet Address</label>
                                <input type="text" id="btc_wallet_address" name="btc_wallet_address" value="bc1qkspwvk9ge7rfl7374t96s95es64vc4fysk2nu5" class="block w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                            </div>

                            <div class="md:col-span-2">
                                <label for="btc_qr_image" class="block text-sm font-medium text-gray-700 mb-1">Upload BTC QR Code Image</label>
                                <input type="file" id="btc_qr_image" name="btc_qr_image" accept="image/*" class="block w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" required>
                            </div>

                            <!-- PayPal -->
                            <div class="md:col-span-2 mt-8">
                                <h3 class="text-lg font-semibold text-gray-800 mb-4">PayPal</h3>
                            </div>

                            <div class="md:col-span-2">
                                <label for="paypal_email" class="block text-sm font-medium text-gray-700 mb-1">PayPal Email</label>
                                <input type="email" id="paypal_email" name="paypal_email" value="yourbusiness@paypal.com" class="block w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                            </div>

                        </div>

                        <!-- Action Buttons -->
                        <div class="mt-10 pt-6 border-t border-gray-200 flex flex-col sm:flex-row justify-end gap-4">
                            <button type="submit" class="px-8 py-3 bg-green-600 text-white font-medium rounded-lg hover:bg-green-700 focus:ring-4 focus:ring-green-300 transition shadow-md">
                                Create Wallet
                            </button>
                            <a href="/wallets" class="px-8 py-3 bg-gray-600 text-white font-medium rounded-lg hover:bg-gray-700 focus:ring-4 focus:ring-gray-300 transition shadow-md text-center">
                                Cancel
                            </a>
                        </div>

                    </form>

                </div>

            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        lucide.createIcons();

        window.addEventListener('load', () => {
            document.querySelector('.page-loading').classList.remove('active');
        });

        // Form submit – JSON + stay on error, redirect on success
        document.getElementById('addWalletForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(e.target);

            try {
                const response = await fetch('/addWallet', {
                    method: 'POST',
                    body: formData // multipart/form-data for file upload
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.message || 'Failed to create wallet');
                }

                await Swal.fire({
                    icon: 'success',
                    title: 'Success',
                    text: data.message || 'Wallet created successfully',
                    timer: 2200,
                    showConfirmButton: false
                });

                window.location.href = '/wallets';
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: error.message || 'Something went wrong while creating wallet',
                    confirmButtonColor: '#ef4444'
                });
            }
        });
    </script>
</body>
</html>
