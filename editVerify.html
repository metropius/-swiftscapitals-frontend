<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>swiftcaptial | Edit KYC Verification</title>
    <meta name="description" content="Edit KYC verification - Admin panel" />

    <link rel="shortcut icon" href="/storage/app/public/photos/TydZYFQSbyrBue0oZ1BQzOAr8y3J4VixErlONeNz.png" />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        document.documentElement.style.setProperty('--primary-color', '#0ea5e9');
        document.documentElement.style.setProperty('--primary-color-dark', '#0369a1');
        document.documentElement.style.setProperty('--primary-color-light', '#38bdf8');
        document.documentElement.style.setProperty('--secondary-color', '#14b8a6');
        document.documentElement.style.setProperty('--accent-color', '#ec4899');
        document.documentElement.style.setProperty('--text-color', '#111827');
        document.documentElement.style.setProperty('--bg-color', '#f9fafb');
        document.documentElement.style.setProperty('--sidebar-bg-color', '#1e293b');
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {500:'#0ea5e9',600:'#0ea5e9',700:'#0369a1'},
                        secondary: {500:'#14b8a6',600:'#0f766e'},
                        accent: {500:'#ec4899',600:'#db2777'}
                    }
                }
            }
        }
    </script>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: "Graphik", system-ui, sans-serif; }
        .page-loading { position:fixed; inset:0; background:#fff; z-index:9999; transition:all .4s .2s; }
        .page-loading.active { opacity:1; visibility:visible; }
    </style>
</head>

<body class="bg-gray-50 min-h-screen">

    <div class="flex h-screen overflow-hidden" x-data="{ mobileMenuOpen: false }">

        <!-- Sidebar -->
        <div :class="mobileMenuOpen ? 'translate-x-0' : '-translate-x-full'" 
             class="fixed inset-y-0 left-0 z-50 w-64 bg-gray-900 text-white transform transition-transform duration-300 ease-in-out md:relative md:translate-x-0">
            <div class="p-6 border-b border-gray-800">
                <a href="/adminiRoute">
                    <img src="/storage/app/public/photos/I98wEMilPMHkNy8wxBtJ86dmMTWl2kK4kkPJNI9l.png" alt="Logo" class="h-10 w-auto mx-auto">
                </a>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
                <a href="/adminiRoute" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 transition-colors">
                    <i data-lucide="home" class="w-5 h-5 mr-3"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/all-cards" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 transition-colors">
                    <i data-lucide="credit-card" class="w-5 h-5 mr-3"></i>
                    <span>All Cards</span>
                </a>
                <a href="/allTransfer" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 transition-colors">
                    <i data-lucide="send" class="w-5 h-5 mr-3"></i>
                    <span>All Transfers</span>
                </a>
                <a href="/allFunding" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 transition-colors">
                    <i data-lucide="download" class="w-5 h-5 mr-3"></i>
                    <span>All Deposits</span>
                </a>
                <a href="/wallets" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 transition-colors">
                    <i data-lucide="wallet" class="w-5 h-5 mr-3"></i>
                    <span>Wallets</span>
                </a>
                <a href="/allRefund" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 transition-colors">
                    <i data-lucide="refresh-cw" class="w-5 h-5 mr-3"></i>
                    <span>All Refunds</span>
                </a>
                <a href="/allLoans" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 transition-colors">
                    <i data-lucide="landmark" class="w-5 h-5 mr-3"></i>
                    <span>All Loans</span>
                </a>
                <a href="/allVerify" class="flex items-center px-4 py-3 rounded-lg bg-blue-600/20 text-blue-400">
                    <i data-lucide="shield-check" class="w-5 h-5 mr-3"></i>
                    <span>All Verifications</span>
                </a>
                <a href="/allTickets" class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-800 transition-colors">
                    <i data-lucide="ticket" class="w-5 h-5 mr-3"></i>
                    <span>Support Tickets</span>
                </a>
                <div class="pt-6 mt-auto border-t border-gray-800">
                    <a href="/logout" class="flex items-center px-4 py-3 rounded-lg text-red-400 hover:bg-gray-800 hover:text-red-300 transition-colors">
                        <i data-lucide="log-out" class="w-5 h-5 mr-3"></i>
                        <span>Logout</span>
                    </a>
                </div>
            </nav>
        </div>

        <!-- Mobile menu toggle -->
        <button @click="mobileMenuOpen = !mobileMenuOpen" class="md:hidden fixed top-4 left-4 z-50 bg-gray-900 text-white p-3 rounded-full shadow-lg">
            <i data-lucide="menu" class="w-6 h-6"></i>
        </button>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-hidden">

            <header class="bg-white shadow-sm z-10">
                <div class="px-6 py-4 flex justify-between items-center">
                    <h1 class="text-xl font-bold text-gray-900">Edit KYC Verification</h1>
                    <a href="/viewVerify/<%= verification._id %>" class="text-blue-600 hover:underline flex items-center">
                        <i data-lucide="arrow-left" class="w-4 h-4 mr-1"></i> View Verification
                    </a>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto p-6">

                <div class="max-w-5xl mx-auto bg-white shadow-lg rounded-xl overflow-hidden">

                    <!-- Form -->
                    <form id="editVerifyForm" class="p-8">

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                            <!-- Status -->
                            <div>
                                <label for="status" class="block text-sm font-medium text-gray-700 mb-1">Verification Status</label>
                                <select id="status" name="status" class="block w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" required>
                                    <option value="pending" <%= verification.status === 'pending' ? 'selected' : '' %>>Pending</option>
                                    <option value="under review" <%= verification.status === 'under review' ? 'selected' : '' %>>Under Review</option>
                                    <option value="approved" <%= verification.status === 'approved' ? 'selected' : '' %>>Approved</option>
                                    <option value="rejected" <%= verification.status === 'rejected' ? 'selected' : '' %>>Rejected</option>
                                    <option value="declined" <%= verification.status === 'declined' ? 'selected' : '' %>>Declined</option>
                                </select>
                            </div>

                            <!-- Rejection Reason (shown only for rejected/declined) -->
                            <div class="md:col-span-2" id="rejectionReasonGroup" style="display: <%= ['rejected','declined'].includes(verification.status) ? 'block' : 'none' %>;">
                                <label for="rejectionReason" class="block text-sm font-medium text-gray-700 mb-1">Rejection / Decline Reason</label>
                                <textarea id="rejectionReason" name="rejectionReason" rows="4" class="block w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"><%= verification.rejectionReason || '' %></textarea>
                            </div>

                        </div>

                        <!-- Action Buttons -->
                        <div class="mt-10 pt-6 border-t border-gray-200 flex flex-col sm:flex-row justify-end gap-4">
                            <button type="submit" class="px-8 py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 transition shadow-md">
                                Update Status
                            </button>
                            <a href="/viewVerify/<%= verification._id %>" class="px-8 py-3 bg-gray-600 text-white font-medium rounded-lg hover:bg-gray-700 focus:ring-4 focus:ring-gray-300 transition shadow-md text-center">
                                Cancel
                            </a>
                        </div>

                    </form>

                </div>

            </main>
        </div>
    </div>

    <script>
        lucide.createIcons();

        window.addEventListener('load', () => {
            document.querySelector('.page-loading').classList.remove('active');
        });

        // Show/hide rejection reason based on status
        document.getElementById('status')?.addEventListener('change', function() {
            const reasonGroup = document.getElementById('rejectionReasonGroup');
            reasonGroup.style.display = ['rejected', 'declined'].includes(this.value) ? 'block' : 'none';
        });

        // Form submit – JSON + stay on error, redirect on success
        document.getElementById('editVerifyForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = Object.fromEntries(new FormData(e.target));

            try {
                const response = await fetch(`/editVerify/<%= verification._id %>`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.message || 'Failed to update verification');
                }

                await Swal.fire({
                    icon: 'success',
                    title: 'Success',
                    text: data.message || 'Verification updated successfully',
                    timer: 2200,
                    showConfirmButton: false
                });

                window.location.href = '/allVerify';
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: error.message || 'Something went wrong while updating',
                    confirmButtonColor: '#ef4444'
                });
            }
        });
    </script>
</body>
</html>
