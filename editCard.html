<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>swiftcaptial | Edit Card</title>
    <meta name="description" content="Edit card details - Admin panel" />
    <link rel="shortcut icon" href="/assets/favicon.png" />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script>
        document.documentElement.style.setProperty('--primary-color', '#0ea5e9');
        document.documentElement.style.setProperty('--primary-color-dark', '#0369a1');
        document.documentElement.style.setProperty('--primary-color-light', '#38bdf8');
        document.documentElement.style.setProperty('--secondary-color', '#14b8a6');
        document.documentElement.style.setProperty('--accent-color', '#ec4899');
        document.documentElement.style.setProperty('--text-color', '#111827');
        document.documentElement.style.setProperty('--bg-color', '#f9fafb');
        document.documentElement.style.setProperty('--sidebar-bg-color', '#1e293b');
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {500:'#0ea5e9',600:'#0ea5e9',700:'#0369a1'},
                        secondary: {500:'#14b8a6',600:'#0f766e'},
                        accent: {500:'#ec4899',600:'#db2777'}
                    }
                }
            }
        }
    </script>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: "Graphik", system-ui, sans-serif; }
        .page-loading {
            position: fixed; inset: 0; background: #fff; z-index: 9999;
            transition: all .4s .2s; visibility: hidden; opacity: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .page-loading.active { opacity: 1; visibility: visible; }
        .loading-animation { width: 80px; height: 80px; position: relative; }
        .circle {
            position: absolute; inset: 0; border: 4px solid transparent;
            border-radius: 50%; animation: rotateCircle 1.5s linear infinite;
        }
        .circle:nth-child(1) { border-top-color: var(--primary-color); }
        .circle:nth-child(2) { border-right-color: var(--primary-color-light); animation-delay: .2s; }
        @keyframes rotateCircle { to { transform: rotate(360deg); } }
        [x-cloak] { display: none !important; }
    </style>
</head>

<body class="bg-gray-50 min-h-screen">

    <div class="page-loading active" id="pageLoader">
        <div class="loading-animation">
            <div class="circle"></div>
            <div class="circle"></div>
        </div>
    </div>

    <div class="flex h-screen overflow-hidden" x-data="{ mobileMenuOpen: false }">

        <div :class="mobileMenuOpen ? 'translate-x-0' : '-translate-x-full'"
             class="fixed inset-y-0 left-0 z-50 w-64 bg-gray-900 text-white transform transition-transform duration-300 ease-in-out md:relative md:translate-x-0 flex flex-col">
            <div class="p-6 border-b border-gray-800">
                <a href="adminDashboard.html">
                    <img src="assets/logo.png" alt="Logo" class="h-10 w-auto mx-auto" onerror="this.src='https://ui-avatars.com/api/?name=SC&background=0ea5e9&color=fff'">
                </a>
            </div>

            <div class="px-4 py-4 border-b border-gray-800">
                <div class="flex items-center gap-3">
                    <img id="admin-avatar" src="" alt="Admin" class="h-10 w-10 rounded-full object-cover border-2 border-gray-700">
                    <div class="min-w-0">
                        <p class="text-sm font-medium text-white truncate" id="admin-name">Loading...</p>
                        <p class="text-xs text-gray-400 truncate" id="admin-email">—</p>
                    </div>
                </div>
            </div>

            <nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto">
                <a href="adminDashboard.html" class="flex items-center px-3 py-3 rounded-lg hover:bg-gray-800">
                    <i data-lucide="home" class="w-5 h-5 mr-3"></i>
                    Dashboard
                </a>
                <a href="all-cards.html" class="flex items-center px-3 py-3 rounded-lg bg-blue-600/20 text-blue-400">
                    <i data-lucide="credit-card" class="w-5 h-5 mr-3"></i>
                    All Cards
                </a>
                <a href="allTransfer.html" class="flex items-center px-3 py-3 rounded-lg hover:bg-gray-800">
                    <i data-lucide="send" class="w-5 h-5 mr-3"></i>
                    All Transfers
                </a>
                <a href="allFunding.html" class="flex items-center px-3 py-3 rounded-lg hover:bg-gray-800">
                    <i data-lucide="download" class="w-5 h-5 mr-3"></i>
                    All Deposits
                </a>
                <a href="wallets.html" class="flex items-center px-3 py-3 rounded-lg hover:bg-gray-800">
                    <i data-lucide="wallet" class="w-5 h-5 mr-3"></i>
                    Wallets
                </a>
                <a href="allRefund.html" class="flex items-center px-3 py-3 rounded-lg hover:bg-gray-800">
                    <i data-lucide="refresh-cw" class="w-5 h-5 mr-3"></i>
                    All Refunds
                </a>
                <a href="allLoans.html" class="flex items-center px-3 py-3 rounded-lg hover:bg-gray-800">
                    <i data-lucide="landmark" class="w-5 h-5 mr-3"></i>
                    All Loans
                </a>
                <a href="allVerify.html" class="flex items-center px-3 py-3 rounded-lg hover:bg-gray-800">
                    <i data-lucide="shield-check" class="w-5 h-5 mr-3"></i>
                    All Verifications
                </a>
                <a href="allTickets.html" class="flex items-center px-3 py-3 rounded-lg hover:bg-gray-800">
                    <i data-lucide="ticket" class="w-5 h-5 mr-3"></i>
                    Support Tickets
                </a>
                <div class="pt-6 mt-auto border-t border-gray-800">
                    <a href="#" onclick="logout(); return false;" class="flex items-center px-3 py-3 rounded-lg text-red-400 hover:bg-gray-800">
                        <i data-lucide="log-out" class="w-5 h-5 mr-3"></i>
                        Logout
                    </a>
                </div>
            </nav>
        </div>

        <button @click="mobileMenuOpen = !mobileMenuOpen" class="md:hidden fixed top-4 left-4 z-50 bg-gray-900 text-white p-3 rounded-full shadow-lg">
            <i data-lucide="menu" class="w-6 h-6"></i>
        </button>

        <div class="flex-1 flex flex-col overflow-hidden">

            <header class="bg-white shadow-sm z-10">
                <div class="px-6 py-4 flex items-center justify-between">
                    <h1 class="text-xl md:text-2xl font-bold text-gray-900">Edit Card</h1>
                    <a href="#" id="view-card-link" class="flex items-center text-blue-600 hover:text-blue-800 font-medium">
                        <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i>
                        View Card
                    </a>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto p-6 bg-gray-100">

                <div class="max-w-5xl mx-auto bg-white shadow-lg rounded-xl overflow-hidden">

                    <form id="editCardForm" class="p-8">

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                            <div>
                                <label for="cardType" class="block text-sm font-medium text-gray-700 mb-1">Card Type</label>
                                <select id="cardType" name="cardType" class="block w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" required>
                                    <option value="visa">Visa</option>
                                    <option value="mastercard">Mastercard</option>
                                    <option value="american_express">American Express</option>
                                </select>
                            </div>

                            <div>
                                <label for="cardLevel" class="block text-sm font-medium text-gray-700 mb-1">Card Level</label>
                                <select id="cardLevel" name="cardLevel" class="block w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" required>
                                    <option value="standard">Standard</option>
                                    <option value="gold">Gold</option>
                                    <option value="platinum">Platinum</option>
                                    <option value="black">Black</option>
                                </select>
                            </div>

                            <div>
                                <label for="cardNumber" class="block text-sm font-medium text-gray-700 mb-1">Card Number</label>
                                <input type="text" id="cardNumber" name="cardNumber" value="" class="block w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" required>
                            </div>

                            <div>
                                <label for="expiryDate" class="block text-sm font-medium text-gray-700 mb-1">Expiry Date (MM/YY)</label>
                                <input type="text" id="expiryDate" name="expiryDate" value="" class="block w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" required>
                            </div>

                            <div>
                                <label for="cvv" class="block text-sm font-medium text-gray-700 mb-1">CVV</label>
                                <input type="text" id="cvv" name="cvv" value="" class="block w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" required>
                            </div>

                            <div>
                                <label for="cardHolderName" class="block text-sm font-medium text-gray-700 mb-1">Card Holder Name</label>
                                <input type="text" id="cardHolderName" name="cardHolderName" value="" class="block w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" required>
                            </div>

                            <div>
                                <label for="currency" class="block text-sm font-medium text-gray-700 mb-1">Currency</label>
                                <select id="currency" name="currency" class="block w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" required>
                                    <option value="USD">USD</option>
                                    <option value="EUR">EUR</option>
                                    <option value="GBP">GBP</option>
                                </select>
                            </div>

                            <div>
                                <label for="balance" class="block text-sm font-medium text-gray-700 mb-1">Balance</label>
                                <input type="number" step="0.01" id="balance" name="balance" value="" class="block w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" required>
                            </div>

                            <div>
                                <label for="dailyLimit" class="block text-sm font-medium text-gray-700 mb-1">Daily Limit</label>
                                <input type="number" id="dailyLimit" name="dailyLimit" value="" class="block w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" required>
                            </div>

                            <div>
                                <label for="status" class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                                <select id="status" name="status" class="block w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" required>
                                    <option value="pending">Pending</option>
                                    <option value="active">Active</option>
                                    <option value="suspended">Suspended</option>
                                    <option value="expired">Expired</option>
                                    <option value="declined">Declined</option>
                                </select>
                            </div>

                            <div class="md:col-span-2">
                                <label for="rejectionReason" class="block text-sm font-medium text-gray-700 mb-1">Rejection Reason (if declined)</label>
                                <textarea id="rejectionReason" name="rejectionReason" rows="3" class="block w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"></textarea>
                            </div>

                        </div>

                        <div class="mt-10 pt-6 border-t border-gray-200 flex flex-col sm:flex-row justify-end gap-4">
                            <button type="submit" id="saveBtn" class="px-8 py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 transition shadow-md disabled:opacity-60">
                                Save Changes
                            </button>
                            <a href="#" id="cancel-link" class="px-8 py-3 bg-gray-600 text-white font-medium rounded-lg hover:bg-gray-700 focus:ring-4 focus:ring-gray-300 transition shadow-md text-center">
                                Cancel
                            </a>
                        </div>

                    </form>

                </div>

            </main>
        </div>
    </div>

    <script src="public/js/config.js"></script>
    <script src="public/js/auth.js"></script>
    <script src="public/js/editCard.js"></script>
</body>
</html>
